<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ひらがなすごろく | HIRAGANA SUGOROKU</title>
<style>
:root{
  --cream:#faf3e8; --pink:#e88ca0; --pink-deep:#c9607a; --blue:#4a7ba6;
  --ink:#2b2620; --line:#8a5a63; --gold:#d9a441;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Hiragino Sans','Yu Gothic',"Segoe UI",sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 8% 12%,rgba(232,140,160,.18),transparent 40%),radial-gradient(circle at 92% 88%,rgba(74,123,166,.14),transparent 45%);}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
.screen.active{display:flex;}
h1.title-jp{font-size:clamp(2rem,6vw,3.6rem);color:var(--pink-deep);margin:0;}
h2.title-en{font-size:clamp(.8rem,2.2vw,1.1rem);letter-spacing:.3em;color:var(--blue);margin:6px 0;}
.romaji-line{font-size:1rem;color:#7a5a50;margin:4px 0;}
.tagline{font-size:1.15rem;color:#5a5348;margin:14px 0 30px;}
button{font-family:inherit;cursor:pointer;border:none;}
.btn-main{background:var(--pink);color:#fff;font-size:1.25rem;padding:15px 42px;border-radius:40px;box-shadow:0 6px 0 var(--pink-deep);}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep);}
.btn-secondary{background:var(--blue);color:#fff;font-size:1rem;padding:12px 26px;border-radius:30px;box-shadow:0 4px 0 #2c5170;margin-top:14px;}
.btn-secondary:active{transform:translateY(3px);box-shadow:0 1px 0 #2c5170;}
.group-choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px;margin-bottom:22px;}
.chip{padding:12px 18px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:1.1rem;min-width:50px;color:var(--pink-deep);font-weight:700;}
.chip.selected{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep);}
#gameScreen{justify-content:flex-start;padding:10px;}
.hud{width:100%;max-width:1000px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
.score-card{background:#fff;border-radius:12px;padding:7px 12px;border:2px solid var(--line);font-size:.85rem;min-width:110px;display:flex;align-items:center;gap:6px;}
.score-card.active{border-color:var(--gold);background:#fff8e6;}
.turn-banner{background:var(--pink-deep);color:#fff;padding:9px 22px;border-radius:22px;font-size:1.05rem;margin-bottom:10px;}
#boardWrap{position:relative;width:100%;max-width:1000px;margin-bottom:12px;background:
  repeating-radial-gradient(circle at 12px 12px, rgba(138,82,64,.06) 0, rgba(138,82,64,.06) 2px, transparent 2px, transparent 22px);
  border-radius:20px;padding:14px;}
.board-decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:20px;}
.board-decor span{position:absolute;opacity:.16;filter:saturate(.8);}
#board{position:relative;width:100%;}
#boardSvg{position:absolute;inset:0;width:100%;height:100%;}
.pathline{fill:none;stroke:#8a5240;stroke-width:.42;stroke-linecap:round;stroke-linejoin:round;}
.pathdot{fill:#8a5240;}
.cell{position:absolute;background:#fff;border:3px solid var(--line);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.62rem;color:#8a8272;}
.cell .num{position:absolute;top:2px;left:6px;font-size:.62rem;color:#5a4030;font-weight:800;}
.cell.type-challenge{background:#fdf0f2;}
.cell.type-bonus{background:#fff6df;}
.cell.type-kesempatan{background:#eef6ee;}
.cell.type-mundur{background:#f3e9e9;}
.cell.type-ulangi{background:#e9eef6;}
.cell.type-istirahat{background:#f0e9f6;}
.cell.start,.cell.goal{background:var(--pink-deep);color:#fff;font-weight:700;font-size:.75rem;border-color:var(--pink-deep);}
.cell .icon{font-size:1rem;}
.badge{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:900;color:var(--blue);white-space:nowrap;}
.pieces{position:absolute;top:-12px;display:flex;gap:3px;flex-wrap:wrap;justify-content:center;width:100%;}
.token{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:900;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;}
.controls{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;}
#diceBtn{background:var(--gold);color:#fff;font-size:1.3rem;padding:14px 32px;border-radius:16px;box-shadow:0 5px 0 #a97b21;}
#diceBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #a97b21;}
#diceBtn:disabled{opacity:.5;cursor:default;}
#diceResult{font-size:1.8rem;margin-top:4px;min-height:2.2rem;}
.modal-bg{position:fixed;inset:0;background:rgba(20,20,20,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:14px;}
.modal-bg.active{display:flex;}
.modal{background:#fff;border-radius:18px;padding:26px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25);}
.modal h3{color:var(--blue);margin-top:0;}
.modal p{color:var(--ink);font-size:1.05rem;font-weight:600;line-height:1.5;}
.prompt-jp{font-size:3rem;color:var(--pink-deep);margin:8px 0;}
.timer-box{font-size:1.1rem;color:var(--pink-deep);font-weight:700;margin-bottom:8px;}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.opt-btn{background:var(--cream);border:2px solid var(--line);border-radius:12px;padding:13px;font-size:1.1rem;color:var(--ink);}
.opt-btn.correct{background:#d9f0d9;border-color:#5aa85a;}
.opt-btn.wrong{background:#f6d9d9;border-color:#b85555;}
.feedback{font-size:1.35rem;font-weight:700;margin:8px 0;min-height:1.7rem;}
#specialBanner{font-size:1.6rem;font-weight:900;color:var(--pink-deep);margin:14px 0;}
.write-input{font-size:1.3rem;padding:10px 16px;border:2px solid var(--line);border-radius:10px;width:70%;margin:10px 0;text-align:center;}
.teacher-check{display:flex;gap:10px;justify-content:center;margin-top:10px;}
.btn-ok{background:#5aa85a;color:#fff;padding:10px 20px;border-radius:10px;font-size:1rem;}
.btn-no{background:#b85555;color:#fff;padding:10px 20px;border-radius:10px;font-size:1rem;}
#winScreen h1{font-size:2.6rem;}
.hidden{display:none !important;}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
  <h1 class="title-jp">「ひらがなすごろく」</h1>
  <h2 class="title-en">HIRAGANA SUGOROKU</h2>
  <p class="romaji-line">「Hiragana o Geemu de Oboeyou!」</p>
  <p class="tagline">Ayo belajar hiragana lewat game!</p>
  <button class="btn-main" onclick="goToSetup()">▶ Sutaato</button>
  <button class="btn-secondary" onclick="showRules()">📖 Aturan Main</button>
</div>

<div id="setupScreen" class="screen">
  <h2 style="color:var(--pink-deep);">Pilih jumlah kelompok</h2>
  <div class="group-choices" id="groupChoices"></div>
  <button class="btn-main" id="startGameBtn" onclick="startGame()" disabled>Mulai Permainan</button>
</div>

<div id="gameScreen" class="screen">
  <div class="hud" id="hud"></div>
  <div class="turn-banner" id="turnBanner"></div>
  <div id="boardWrap">
    <div class="board-decor">
      <span style="left:1%;bottom:-4%;font-size:5.5rem;">🗻</span>
      <span style="right:3%;top:-5%;font-size:3rem;">🌸</span>
      <span style="left:22%;top:-6%;font-size:2.4rem;">☁️</span>
      <span style="right:20%;bottom:-6%;font-size:2.6rem;">☁️</span>
      <span style="left:48%;top:-7%;font-size:2rem;">🌸</span>
      <span style="right:45%;bottom:-4%;font-size:2.2rem;">☁️</span>
    </div>
    <div id="board"></div>
  </div>
  <div class="controls">
    <button id="diceBtn" onclick="rollDice()">🎲 LEMPAR DADU</button>
    <div id="diceResult"></div>
  </div>
</div>

<div id="winScreen" class="screen">
  <h1>🏆 Omedetou！</h1>
  <h2 id="winTeamText" style="color:var(--pink-deep);"></h2>
  <p style="font-size:1.3rem;color:var(--blue);font-weight:700;">HIRAGANA MASTER！</p>
  <button class="btn-secondary" onclick="location.reload()">「Mou ichido asobu!」</button>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>

<script>
/* ============ DATA ============ */
/* Semua soal pakai KOSAKATA (bukan huruf satuan), supaya lebih menarik & bervariasi */
const WORDS = [
 {k:'ねこ',r:'neko'},{k:'いぬ',r:'inu'},{k:'とり',r:'tori'},{k:'さかな',r:'sakana'},
 {k:'うさぎ',r:'usagi'},{k:'ぞう',r:'zou'},{k:'さくら',r:'sakura'},{k:'やま',r:'yama'},
 {k:'そら',r:'sora'},{k:'はな',r:'hana'},{k:'くも',r:'kumo'},{k:'みず',r:'mizu'},
 {k:'たまご',r:'tamago'},{k:'すし',r:'sushi'},{k:'ごはん',r:'gohan'},{k:'りんご',r:'ringo'},
 {k:'みかん',r:'mikan'},{k:'がっこう',r:'gakkou'},{k:'せんせい',r:'sensei'},{k:'ともだち',r:'tomodachi'},
 {k:'あか',r:'aka'},{k:'あお',r:'ao'},{k:'きいろ',r:'kiiro'},{k:'しろ',r:'shiro'},{k:'くろ',r:'kuro'},
 {k:'いち',r:'ichi'},{k:'さん',r:'san'},{k:'よん',r:'yon'},
 {k:'おはよう',r:'ohayou'},{k:'こんにちは',r:'konnichiwa'},{k:'ありがとう',r:'arigatou'},{k:'さようなら',r:'sayounara'},
 {k:'たべる',r:'taberu'},{k:'のむ',r:'nomu'},{k:'みる',r:'miru'},{k:'いく',r:'iku'},{k:'ねる',r:'neru'}
];
/* Khusus tipe "Tebak Hiragana": hanya 3 soal (sesuai permintaan) */
const TEBAK_POOL = [ {k:'ねこ',r:'neko'}, {k:'さくら',r:'sakura'}, {k:'ありがとう',r:'arigatou'} ];
/* Pelacak soal yang sudah keluar, supaya tidak ada soal sama berulang dalam 1 sesi permainan */
let usedWords = new Set();
let usedTebak = new Set();
function pickWord(){
  let avail = WORDS.filter(w=>!usedWords.has(w.r));
  if(avail.length===0){ usedWords.clear(); avail = WORDS; }
  const w = rnd(avail); usedWords.add(w.r); return w;
}
function pickTebak(){
  let avail = TEBAK_POOL.filter(w=>!usedTebak.has(w.r));
  if(avail.length===0){ usedTebak.clear(); avail = TEBAK_POOL; }
  const w = rnd(avail); usedTebak.add(w.r); return w;
}

const NUM_SQUARES = 24;
const COLS = 6;
let teams = [], currentTurn = 0, numGroups = 0, boardMeta = [];
const TEAM_COLORS = ['#e88ca0','#4a7ba6','#d9a441','#5aa85a','#9a6bb0','#c96b3a','#3aa3a3','#b0507a','#7a8c3a','#5a5aa8'];
const DECOR = ['🌸','☁️','⛩️','🗻','🌞','🍡'];
/* Hanya sedikit kotak khusus, sisanya (mayoritas) adalah kotak soal (challenge) */
const SPECIALS = {4:'bonus',9:'kesempatan',13:'istirahat',18:'mundur',22:'ulangi'};
const SPECIAL_LABEL = {bonus:'⭐ BONUS',kesempatan:'🎁 KESEMPATAN',mundur:'⏪ MUNDUR',ulangi:'🔄 ULANGI',istirahat:'😴 ISTIRAHAT'};

/* ============ RULES ============ */
function showRules(){
  document.getElementById('modalContent').innerHTML = `
    <h3 style="color:var(--pink-deep);">📖 Aturan Main HIRAGANA SUGOROKU</h3>
    <div style="text-align:left;font-size:.95rem;line-height:1.6;max-height:60vh;overflow-y:auto;">
      <p><b>1. Pemain</b><br>Kelas dibagi menjadi 2–10 kelompok. Setiap kelompok punya bidak dengan warna/nomor sendiri.</p>
      <p><b>2. Cara Main</b><br>Tekan tombol <b>🎲 LEMPAR DADU</b> saat giliran kelompokmu. Bidak akan otomatis maju sesuai angka dadu, lalu giliran berpindah ke kelompok berikutnya.</p>
      <p><b>3. Kotak Tantangan (❓)</b><br>Jika bidak berhenti di kotak ini, kelompok akan diberi 1 soal hiragana secara acak (Membaca Kata, Tebak Hiragana, Cocokkan, Dengarkan, atau Tulis), dengan waktu 60 detik. Jawaban benar mendapat <b>+10 poin</b>.</p>
      <p><b>4. Kotak Khusus</b><br>
      ⭐ BONUS: maju 2 langkah<br>
      🎁 KESEMPATAN: lempar dadu sekali lagi<br>
      ⏪ MUNDUR: mundur 2 langkah<br>
      🔄 ULANGI: main sekali lagi<br>
      😴 ISTIRAHAT: giliran berikutnya kelompok ini dilewati</p>
      <p><b>5. Menang</b><br>Kelompok pertama yang mencapai kotak GOAL adalah pemenangnya, tidak peduli skor poinnya. Skor poin hanya untuk melihat siapa yang paling jago menjawab soal hiragana selama permainan.</p>
      <p><b>6. Tombol "Tsugi!"</b><br>Selalu tekan tombol ini setelah selesai membaca hasil kotak khusus atau soal, untuk lanjut ke giliran berikutnya.</p>
    </div>
    <button class="btn-secondary" onclick="closeModalOnly()">Tsugi!</button>`;
  document.getElementById('modalBg').classList.add('active');
}
function closeModalOnly(){ document.getElementById('modalBg').classList.remove('active'); }

/* ============ SOUND EFFECTS (Web Audio API, tanpa file eksternal) ============ */
function beep(freq,duration=120,type='sine',vol=0.18,delay=0){
  try{
    const ctx = window.audioCtx || (window.audioCtx = new (window.AudioContext||window.webkitAudioContext)());
    setTimeout(()=>{
      const osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+duration/1000);
      osc.stop(ctx.currentTime+duration/1000);
    },delay);
  }catch(e){}
}
function soundDiceTick(){ beep(600,45,'square',0.1); }
function soundStep(){ beep(500,80,'square',0.14); }
function soundBack(){ beep(230,120,'square',0.14); }
function soundChallenge(){ beep(880,140,'triangle',0.2); beep(1046,160,'triangle',0.2,120); }
function soundBonus(){ beep(660,110,'triangle',0.2); beep(880,160,'triangle',0.2,100); beep(1108,180,'triangle',0.2,200); }
function soundKesempatan(){ beep(784,120,'triangle',0.2); beep(988,150,'triangle',0.2,110); }
function soundMundur(){ beep(392,150,'sawtooth',0.16); beep(294,220,'sawtooth',0.16,130); }
function soundUlangi(){ beep(523,90,'square',0.15); beep(523,90,'square',0.15,140); beep(523,90,'square',0.15,280); }
function soundIstirahat(){ beep(330,350,'sine',0.14); }
function soundWin(){ beep(660,140,'triangle',0.22); beep(880,140,'triangle',0.22,140); beep(1046,220,'triangle',0.22,280); }
function soundCorrect(){ beep(784,110,'triangle',0.22); beep(988,110,'triangle',0.22,100); beep(1318,180,'triangle',0.22,200); }
function soundWrong(){ beep(311,180,'sawtooth',0.18); beep(233,260,'sawtooth',0.18,150); }
function soundClick(){ beep(700,55,'square',0.12); }

/* ============ MUSIK LATAR (halaman awal & menunggu) ============ */
let bgmInterval=null, bgmStep=0;
const BGM_NOTES=[523,587,659,523,494,440,494,392,440,523,587,494];
function startBGM(){
  if(bgmInterval) return;
  bgmStep=0;
  bgmInterval=setInterval(()=>{ beep(BGM_NOTES[bgmStep%BGM_NOTES.length],400,'sine',0.045); bgmStep++; },460);
}
function stopBGM(){ if(bgmInterval){ clearInterval(bgmInterval); bgmInterval=null; } }
document.addEventListener('click', function firstClick(){ startBGM(); document.removeEventListener('click', firstClick); }, {once:true});

/* ============ NAV ============ */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goToSetup(){
  const wrap=document.getElementById('groupChoices'); wrap.innerHTML='';
  for(let n=2;n<=10;n++){
    const c=document.createElement('div'); c.className='chip'; c.textContent=n;
    c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');numGroups=n;document.getElementById('startGameBtn').disabled=false;};
    wrap.appendChild(c);
  }
  showScreen('setupScreen');
}

/* ============ BOARD ============ */
function buildBoardMeta(){
  boardMeta=[];
  for(let i=1;i<=NUM_SQUARES;i++) boardMeta.push({num:i, type:SPECIALS[i]||'challenge'});
}
function snakePos(i,cols){
  const row=Math.floor(i/cols); const c=i%cols;
  const x = row%2===0 ? c : cols-1-c;
  return {x,y:row};
}
function renderBoard(){
  const board=document.getElementById('board'); board.innerHTML='';
  const nodes=[{type:'start'}, ...boardMeta, {type:'goal'}];
  const rows=Math.ceil(nodes.length/COLS);
  board.style.paddingTop=(rows/COLS*100)+'%';
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('id','boardSvg'); svg.setAttribute('viewBox',`0 0 ${COLS} ${rows}`); svg.setAttribute('preserveAspectRatio','none');
  const coords=nodes.map((n,i)=>snakePos(i,COLS));
  const pts=coords.map(p=>`${p.x+0.5},${p.y+0.5}`).join(' ');
  const poly=document.createElementNS(svgNS,'polyline'); poly.setAttribute('points',pts); poly.setAttribute('class','pathline');
  svg.appendChild(poly);
  board.appendChild(svg);
  const cellW=(0.82/COLS*100)+'%', cellH=(0.82/rows*100)+'%';
  nodes.forEach((n,i)=>{
    const p=coords[i];
    const cell=document.createElement('div');
    const type = n.type || 'challenge';
    cell.className='cell '+(type==='start'||type==='goal' ? type : 'type-'+type);
    cell.style.left=((p.x+0.5)/COLS*100)+'%'; cell.style.top=((p.y+0.5)/rows*100)+'%';
    cell.style.width=cellW; cell.style.height=cellH; cell.style.transform='translate(-50%,-50%)';
    if(type==='start'){ cell.id='cellStart'; cell.innerHTML='START<div class="pieces" id="pieces-start"></div>'; }
    else if(type==='goal'){ cell.id='cellGoal'; cell.innerHTML='GOAL<div class="pieces" id="pieces-goal"></div>'; }
    else {
      cell.id='cell-'+n.num;
      const icon = type==='challenge' ? '❓' : SPECIAL_LABEL[type].split(' ')[0];
      const badge = type==='challenge' ? '<div class="badge">SOAL</div>' : `<div class="badge">${SPECIAL_LABEL[type].split(' ')[1]}</div>`;
      cell.innerHTML=`<span class="num">${n.num}</span><span class="icon">${icon}</span>${badge}<div class="pieces" id="pieces-${n.num}"></div>`;
    }
    board.appendChild(cell);
  });
}
function placePieces(){
  document.querySelectorAll('.pieces').forEach(p=>p.innerHTML='');
  teams.forEach(t=>{
    const id = t.pos<=0?'pieces-start':(t.pos>=NUM_SQUARES?'pieces-goal':'pieces-'+t.pos);
    const el=document.getElementById(id); if(!el) return;
    const tok=document.createElement('div'); tok.className='token'; tok.style.background=t.color; tok.textContent=(t.id+1);
    el.appendChild(tok);
  });
}

/* ============ GAME START ============ */
function startGame(){
  buildBoardMeta();
  usedWords = new Set(); usedTebak = new Set();
  teams=[];
  for(let i=0;i<numGroups;i++) teams.push({id:i,name:'Tim '+(i+1),pos:0,score:0,color:TEAM_COLORS[i%TEAM_COLORS.length],skip:false});
  currentTurn=0;
  showScreen('gameScreen'); renderBoard(); renderHud(); placePieces(); updateTurnBanner();
}
function renderHud(){
  const hud=document.getElementById('hud'); hud.innerHTML='';
  teams.forEach((t,i)=>{
    const card=document.createElement('div'); card.className='score-card'+(i===currentTurn?' active':''); card.id='score-'+i;
    card.innerHTML=`<span style="color:${t.color};font-weight:900;">●</span> ${t.name.toUpperCase()}: ${t.score} POIN`;
    hud.appendChild(card);
  });
}
function updateTurnBanner(){
  document.querySelectorAll('.score-card').forEach(c=>c.classList.remove('active'));
  const a=document.getElementById('score-'+currentTurn); if(a)a.classList.add('active');
  document.getElementById('turnBanner').textContent=`Giliran ${teams[currentTurn].name}!`;
}

/* ============ DICE ============ */
function rollDice(){
  document.getElementById('diceBtn').disabled=true;
  const r=document.getElementById('diceResult'); let t=0;
  const spin=setInterval(()=>{ soundDiceTick(); r.textContent='🎲 '+(Math.floor(Math.random()*6)+1); t++;
    if(t>8){ clearInterval(spin); const roll=Math.floor(Math.random()*6)+1; r.textContent='🎲 '+roll; movePiece(roll); }
  },70);
}
function movePiece(steps){
  const team=teams[currentTurn];
  animateSteps(team, steps, ()=>{
    setTimeout(()=>{
      if(team.pos>=NUM_SQUARES){ endGame(team); return; }
      resolveSquare(boardMeta[team.pos-1], team);
    },200);
  });
}
function animateSteps(team, delta, onDone){
  const dir = delta>=0 ? 1 : -1; let remaining=Math.abs(delta);
  function step(){
    if(remaining<=0){ onDone(); return; }
    team.pos = Math.max(0, Math.min(team.pos+dir, NUM_SQUARES));
    placePieces(); bouncePiece(team);
    if(dir>0) soundStep(); else soundBack();
    remaining--;
    if(team.pos>=NUM_SQUARES){ setTimeout(onDone,400); return; }
    setTimeout(step,380);
  }
  step();
}
function bouncePiece(team){
  const id = team.pos<=0?'pieces-start':(team.pos>=NUM_SQUARES?'pieces-goal':'pieces-'+team.pos);
  const el=document.getElementById(id); if(!el) return;
  const tok=el.querySelector('.token'); if(!tok) return;
  tok.style.transform='scale(1.5)';
  setTimeout(()=>{ tok.style.transform='scale(1)'; },150);
}
function resolveSquare(sq, team){
  if(sq.type==='challenge'){ soundChallenge(); openChallenge(team); }
  else if(sq.type==='bonus'){ soundBonus(); showSpecial(team,'⭐ BONUS! Maju 2 langkah!',()=>{ animateSteps(team,2,()=>nextTurn()); }); }
  else if(sq.type==='kesempatan'){ soundKesempatan(); showSpecial(team,'🎁 KESEMPATAN! Lempar dadu sekali lagi!',()=>{document.getElementById('diceBtn').disabled=false;document.getElementById('diceResult').textContent='';}); }
  else if(sq.type==='mundur'){ soundMundur(); showSpecial(team,'⏪ MUNDUR! Mundur 2 langkah!',()=>{ animateSteps(team,-2,()=>nextTurn()); }); }
  else if(sq.type==='ulangi'){ soundUlangi(); showSpecial(team,'🔄 ULANGI! Main sekali lagi!',()=>{document.getElementById('diceBtn').disabled=false;document.getElementById('diceResult').textContent='';}); }
  else if(sq.type==='istirahat'){ soundIstirahat(); showSpecial(team,'😴 ISTIRAHAT! Lewati giliran berikutnya',()=>{team.skip=true;nextTurn();}); }
  else nextTurn();
}
function showSpecial(team,text,after){
  document.getElementById('modalContent').innerHTML=`<div id="specialBanner">${text}</div><button class="btn-secondary" id="tsugiBtn">Tsugi!</button>`;
  document.getElementById('modalBg').classList.add('active');
  document.getElementById('tsugiBtn').onclick=()=>{document.getElementById('modalBg').classList.remove('active');after();};
}
function nextTurn(){
  let tries=0;
  do{ currentTurn=(currentTurn+1)%teams.length; tries++; }while(teams[currentTurn].skip && (teams[currentTurn].skip=false) && tries<teams.length+1);
  renderHud(); updateTurnBanner();
  document.getElementById('diceBtn').disabled=false; document.getElementById('diceResult').textContent='';
}

/* ============ CHALLENGES ============ */
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);}
let qTimer=null, timeLeft=60;
function startTimer(onExpire){
  timeLeft=60; const el=()=>document.getElementById('timerText');
  if(qTimer) clearInterval(qTimer);
  qTimer=setInterval(()=>{ timeLeft--; if(el())el().textContent='⏱ '+timeLeft+' detik'; if(timeLeft<=0){clearInterval(qTimer); onExpire();} },1000);
}
function openChallenge(team){
  const type=rnd(['baca','tebak','cocok','dengar','tulis']);
  const modal=document.getElementById('modalContent'); window.currentChallengeTeam=team; window.answered=false;
  let html='';
  if(type==='baca'){
    const item=pickWord();
    const wrongs=shuffle(WORDS.filter(x=>x.r!==item.r)).slice(0,3).map(x=>x.r);
    const opts=shuffle([item.r,...wrongs]);
    html=`<h3>Membaca Kata</h3><div class="timer-box" id="timerText">⏱ 60 detik</div><p>Pilih romaji yang benar:</p><div class="prompt-jp">${item.k}</div>
      <div class="options">${opts.map(o=>`<button class="opt-btn" onclick="checkAnswer(this,'${o}','${item.r}')">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><button class="btn-secondary hidden" id="nextBtn" onclick="closeChallenge()">Tsugi!</button>`;
  } else if(type==='tebak'){
    const item=pickTebak();
    const wrongs=shuffle(WORDS.filter(x=>x.k!==item.k)).slice(0,3).map(x=>x.k);
    const opts=shuffle([item.k,...wrongs]);
    html=`<h3>Tebak Hiragana</h3><div class="timer-box" id="timerText">⏱ 60 detik</div><p>Pilih hiragana yang sesuai untuk:</p><div class="prompt-jp" style="font-size:2.2rem;">${item.r}</div>
      <div class="options">${opts.map(o=>`<button class="opt-btn" onclick="checkAnswer(this,'${o}','${item.k}')" style="font-size:1.5rem;">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><button class="btn-secondary hidden" id="nextBtn" onclick="closeChallenge()">Tsugi!</button>`;
  } else if(type==='cocok'){
    const item=pickWord();
    const wrongs=shuffle(WORDS.filter(x=>x.r!==item.r)).slice(0,3).map(x=>x.r);
    const opts=shuffle([item.r,...wrongs]);
    html=`<h3>Cocokkan</h3><div class="timer-box" id="timerText">⏱ 60 detik</div><p>Cocokkan dengan romaji yang tepat:</p><div class="prompt-jp">${item.k}</div>
      <div class="options">${opts.map(o=>`<button class="opt-btn" onclick="checkAnswer(this,'${o}','${item.r}')">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><button class="btn-secondary hidden" id="nextBtn" onclick="closeChallenge()">Tsugi!</button>`;
  } else if(type==='dengar'){
    const item=pickWord();
    const wrongs=shuffle(WORDS.filter(x=>x.k!==item.k)).slice(0,3).map(x=>x.k);
    const opts=shuffle([item.k,...wrongs]);
    html=`<h3>Dengarkan</h3><div class="timer-box" id="timerText">⏱ 60 detik</div><p>Dengarkan audio, lalu pilih hiragana yang sesuai:</p>
      <button class="btn-secondary" onclick="speakWord('${item.r}')">🔊 Putar Audio</button>
      <div class="options" style="margin-top:14px;">${opts.map(o=>`<button class="opt-btn" onclick="checkAnswer(this,'${o}','${item.k}')" style="font-size:1.5rem;">${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div><button class="btn-secondary hidden" id="nextBtn" onclick="closeChallenge()">Tsugi!</button>`;
  } else {
    const item=pickWord();
    html=`<h3>Tulis</h3><div class="timer-box" id="timerText">⏱ 60 detik</div><p>Tulis romaji yang benar di kertas/papan!</p><div class="prompt-jp">${item.k}</div>
      <input class="write-input" id="writeInput" placeholder="tulis di kertas..." disabled>
      <p style="color:#8a8272;font-size:.85rem;">Guru yang memeriksa jawaban siswa secara langsung.</p>
      <div class="teacher-check"><button class="btn-ok" onclick="teacherGrade(true)">✔️ Benar (guru menilai)</button><button class="btn-no" onclick="teacherGrade(false)">✖️ Salah</button></div>
      <div class="feedback" id="fb"></div><button class="btn-secondary hidden" id="nextBtn" onclick="closeChallenge()">Tsugi!</button>`;
  }
  modal.innerHTML=html;
  document.getElementById('modalBg').classList.add('active');
  if(type!=='tulis'){
    startTimer(()=>{ if(!window.answered){ window.answered=true; soundWrong(); document.getElementById('fb').textContent='Waktu habis! ⏱'; document.getElementById('fb').style.color='#a83a3a'; document.getElementById('nextBtn').classList.remove('hidden'); } });
  } else {
    startTimer(()=>{ if(document.getElementById('timerText')) document.getElementById('timerText').textContent='⏰ Waktu habis'; });
  }
}
function speakWord(word){
  if('speechSynthesis' in window){
    const u=new SpeechSynthesisUtterance(word); u.lang='ja-JP'; u.rate=0.8;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }
}
function checkAnswer(btn, chosen, correct){
  if(window.answered) return; window.answered=true; if(qTimer) clearInterval(qTimer);
  const ok = chosen===correct;
  if(ok) soundCorrect(); else soundWrong();
  document.querySelectorAll('.opt-btn').forEach(b=>{ if(b.textContent===correct) b.classList.add('correct'); if(b===btn && !ok) b.classList.add('wrong'); });
  if(ok){ window.currentChallengeTeam.score+=10; renderHud(); }
  const fb=document.getElementById('fb');
  fb.textContent = ok ? 'Seikai! 🎉 +10 poin' : `Zannen! ❌ Jawaban benar: ${correct}`;
  fb.style.color = ok ? '#3a8a3a' : '#a83a3a';
  document.getElementById('nextBtn').classList.remove('hidden');
}
function teacherGrade(correct){
  if(window.answered) return; window.answered=true; if(qTimer) clearInterval(qTimer);
  if(correct) soundCorrect(); else soundWrong();
  if(correct){ window.currentChallengeTeam.score+=10; renderHud(); }
  const fb=document.getElementById('fb');
  fb.textContent = correct ? 'Seikai! 🎉 +10 poin (dinilai guru)' : 'Zannen! ❌ (dinilai guru)';
  fb.style.color = correct ? '#3a8a3a' : '#a83a3a';
  document.getElementById('nextBtn').classList.remove('hidden');
}
function closeChallenge(){ document.getElementById('modalBg').classList.remove('active'); nextTurn(); }

/* ============ WIN ============ */
function endGame(team){
  soundWin();
  document.getElementById('winTeamText').textContent = `「${team.name} no kachi desu!」`;
  showScreen('winScreen');
}
</script>
